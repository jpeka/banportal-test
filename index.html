  let service='';
  service+=line('Parkering',t.parking_info|| (t.parking==='yes'?'Finns (uppgift ej verifierad)':null));
  service+=line('Service',t.service_info);
  service+=line('Toalett',t.toilets==='yes'?'Finns (uppgift ej verifierad)':null);
  service+=line('Ansvarig',t.operator_name);
  content+=section('Service och ansvar',service);
  if(t.description)content+=section('Om banan','<div class="popup-row">'+escapeHtml(t.description)+'</div>');
  const safeUrl=(u)=>typeof u==='string'&&/^https?:\/\//i.test(u)?u:null;
  let links='';
  const main=safeUrl(t.enrichment_source);
  const homepage=(t.sources||[]).find(safeUrl);
  if(main)links+='<a class="popup-link" href="'+escapeHtml(main)+'" target="_blank" rel="noopener noreferrer">Granskad källa ↗</a>';
  if(homepage&&homepage!==main)links+='<a class="popup-link" href="'+escapeHtml(homepage)+'" target="_blank" rel="noopener noreferrer">Hemsida / israpport ↗</a>';
  content+=section('Länkar',links||'<div class="popup-note">Ingen webblänk registrerad.</div>');
  const baseContent=content;
  const imageContent=(mode)=>{
    const approved=(t.photos||[]).filter(p=>Number(p.approved)===1&&(p.local_path||safeUrl(p.image_url)));
    const candidates=(t.photos||[]).filter(p=>Number(p.approved)!==1&&(p.local_path||safeUrl(p.image_url)));
    let result='';
    for(const photo of approved.slice(0,3)){
      const url=escapeHtml(photo.local_path||photo.image_url);
      result+='<p><a href="'+url+'" target="_blank" rel="noopener noreferrer"><img class="popup-photo" loading="lazy" src="'+url+'" alt="Bild från '+escapeHtml(t.name)+'"></a>'+(photo.credit?'<span class="popup-note">Foto: '+escapeHtml(photo.credit)+'</span>':'')+(photo.license_url?'<br><a href="'+escapeHtml(photo.license_url)+'" target="_blank">Licens</a>':'')+'</p>';
    }
    if(mode==='all'){
      for(const photo of candidates.slice(0,10)){
        const local=photo.local_path;
        const url=escapeHtml(local||photo.image_url);
        result+='<p><a href="'+url+'" target="_blank" rel="noopener noreferrer"><img class="popup-photo" loading="lazy" src="'+url+'" alt="Bildkandidat för '+escapeHtml(t.name)+'"></a><span class="popup-note">Bildkandidat – motiv och publiceringsrätt ej granskade (endast internt läge).</span>'+(safeUrl(photo.image_url)?'<br><a class="popup-link" href="'+escapeHtml(photo.image_url)+'" target="_blank" rel="noopener noreferrer">Originalkälla ↗</a>':'')+'</p>';
      }
    }
    return result?section('Bilder',result):'';
  };

 const colors={confirmed:'#238b45',likely:'#e2a62d',uncertain:'#c83e3e'};
 const marker=L.circleMarker([lat,lon],{radius:8,color:'#ffffff',weight:2,fillColor:colors[category],fillOpacity:.95}).addTo(map);
 marker.bindPopup(()=>baseContent+imageContent(imageMode.value),{maxWidth:340,autoPan:true,autoPanPaddingTopLeft:[12,105],autoPanPaddingBottomRight:[12,24]});markers.push(marker);bounds.push([lat,lon]);
}
imageMode.addEventListener('change',()=>{for(const marker of markers){if(marker.isPopupOpen()){marker.closePopup();marker.openPopup();}}});
document.getElementById('count').textContent=bounds.length+' banor på kartan · Klicka på en markör';
if(bounds.length)map.fitBounds(bounds,{padding:[35,35],maxZoom:10});
</script></body></html>
